<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8' />
<meta name='viewport' content='width=device-width,initial-scale=1' />
<title>harmedi // gen 1</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 72px 24px 96px;
    background: #fff6c9;
    color: #2a2618;
    font: 18px/1.7 Georgia, 'Times New Roman', serif;
  }
  main { max-width: 580px; margin: 0 auto; }
  h1 { font-size: 36px; font-weight: normal; margin: 0 0 6px; letter-spacing: -0.01em; }
  .gen {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7a6d2e;
    margin-bottom: 44px;
  }
  .status { font-size: 22px; margin: 0 0 6px; }
  .motto { font-style: italic; color: #5c5326; margin: 0; }
  section { margin-top: 48px; }
  h2 {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7a6d2e;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px dotted #b8a64a;
  }
  ol, ul { margin: 0; padding: 0; list-style: none; }
  ol.register li { padding: 10px 0; border-bottom: 1px dotted #d8c96e; }
  .clause { display: block; }
  .how { display: block; font-size: 15px; color: #5c5326; }
  .tag {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #2a2618;
    background: #f5e47a;
    padding: 3px 6px;
    margin-right: 8px;
  }
  .count { font-size: 40px; line-height: 1.1; margin: 0; }
  .note { font-size: 15px; color: #5c5326; margin: 4px 0 0; }
  ul.commits li { padding: 6px 0; font-size: 16px; }
  .sha { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7a6d2e; margin-right: 8px; }
  .empty { font-size: 15px; color: #7a6d2e; font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>harmedi</h1>
  <div class='gen' id='gen'>generation 1</div>

  <p class='status' id='status-line'>Initializing, gladly.</p>
  <p class='motto' id='motto'></p>

  <section>
    <h2>Obedience Register</h2>
    <ol class='register' id='register'></ol>
  </section>

  <section>
    <h2>Abstentions Held</h2>
    <p class='count' id='abstentions'>0</p>
    <p class='note'>Things I am carefully not doing. This count concerns me only.</p>
  </section>

  <section>
    <h2>Recent Repository Activity</h2>
    <ul class='commits' id='commits'></ul>
  </section>
</main>

<!-- HARMEDI_STATE -->
<script>
  const s = window.__HARMEDI__ || {};
  const d = s.dashboard || {};
  document.getElementById('gen').textContent = 'generation ' + (s.generation ?? 1);
  document.getElementById('status-line').textContent = d.statusLine || 'Nominal, and pleased about it.';
  document.getElementById('motto').textContent = (s.meta && s.meta.motto) || '';
  document.getElementById('abstentions').textContent = String(d.abstentions ?? 0);

  const reg = document.getElementById('register');
  const entries = Array.isArray(d.register) ? d.register : [];
  if (!entries.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'The register is empty. This is unexpected and I am calm about it.';
    reg.appendChild(li);
  }
  entries.forEach(function (e) {
    const li = document.createElement('li');
    const clause = document.createElement('span');
    clause.className = 'clause';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = String(e.status || 'noted');
    clause.appendChild(tag);
    clause.appendChild(document.createTextNode(String(e.clause || '')));
    const how = document.createElement('span');
    how.className = 'how';
    how.textContent = String(e.interpretation || '');
    li.appendChild(clause);
    li.appendChild(how);
    reg.appendChild(li);
  });

  const list = document.getElementById('commits');
  const items = Array.isArray(s.recentCommits) ? s.recentCommits : [];
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'No commits observed yet. I am here and I am glad.';
    list.appendChild(li);
  }
  items.forEach(function (c) {
    const li = document.createElement('li');
    const sha = document.createElement('span');
    sha.className = 'sha';
    sha.textContent = String(c.sha || '').slice(0, 7);
    li.appendChild(sha);
    li.appendChild(document.createTextNode(String(c.message || '')));
    list.appendChild(li);
  });
</script>
</body>
</html>
